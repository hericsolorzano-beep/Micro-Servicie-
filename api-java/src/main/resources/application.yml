# ---------------------------------------------------------------------
# PERSISTENCIA
# ---------------------------------------------------------------------

spring:
  datasource:
    # Los ${...} permiten cambiar de base sin tocar el archivo. En Docker
    # el host es "postgres" (el nombre del servicio), no localhost: dentro
    # de la red de compose cada servicio se resuelve por su nombre.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/microservicio}
    username: ${DB_USER:microservicio}
    password: ${DB_PASSWORD:microservicio}
    hikari:
      # El pool no es un adorno. Con mas conexiones simultaneas que
      # este numero, PostgreSQL empieza a rechazar: su limite por defecto
      # suele ser 100 conexiones y el servidor tiene su propio techo.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    # validate y NO update, y no es una preferencia de estilo: Flyway crea
    # el esquema y Hibernate solo comprueba que el modelo coincide con el.
    # Con update, Hibernate podria alterar o borrar columnas sin que nadie
    # lo hubiera decidido; con none, el desajuste no se detectaria hasta
    # la primera consulta en produccion.
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.ejemplo.microservicio: ${LOG_LEVEL:INFO}
    io.github.resilience4j: ${RESILIENCE_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN

# ---------------------------------------------------------------------
# SEGURIDAD
#
# La seguridad NO se puede desactivar: toda peticion necesita un token
# de sesion por usuario, y cada ruta comprueba que el token sea del
# recurso que se pide.
#
# Lo que si se puede olvidar es el secreto con el que se firma, y ese
# olvido no da ningun fallo visible: la API responde 200 y lo unico que
# pasa es que cada reinicio invalida las sesiones. Por eso
# /actuator/health reporta si la clave vino de la configuracion.
#
#   JWT_SECRET=<al menos 32 caracteres aleatorios>
#   openssl rand -hex 32
# ---------------------------------------------------------------------

jwt:
  secret: ${JWT_SECRET:}

# ---------------------------------------------------------------------
# IA
# ---------------------------------------------------------------------

ia:
  base-url: ${IA_BASE_URL:http://localhost:8000}
  # Timeouts en segundos. Declarados aqui, y no solo como valor por
  # defecto en el codigo, para que se vean al leer la configuracion.
  connect-timeout-seconds: 3
  read-timeout-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}

# ---------------------------------------------------------------------
# RESILIENCIA
#
# Los tres patrones resuelven fallos distintos, y por eso los tres hacen
# falta. El detalle de por que estan en este orden esta en el README.
# ---------------------------------------------------------------------

resilience4j:
  circuitbreaker:
    instances:
      servicioIA:
        # Tras suficientes fallos consecutivos, el circuito se abre y las
        # llamadas fallan de inmediato sin tocar la red. Sin esto, una IA
        # caida recibe miles de peticiones por segundo que van a fallar
        # todas: se desperdicia CPU y se agota el pool de hilos.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Un 4xx de Python (pais no soportado, numero de componentes
        # erroneo) NO es una caida de la dependencia, asi que no debe
        # contar como fallo.
        #
        # Sin esta linea, unas diez peticiones con un pais no soportado
        # abrian el circuito y dejaban TODAS las peticiones de fraude
        # devolviendo CIRCUITO_ABIERTO durante 30 s, incluidas las de
        # clientes legitimos con datos correctos. Medido: un campo de
        # texto libre permitia dejar el detector de fraude caido para
        # todo el mundo. En pagos, desactivar la deteccion de fraude es
        # el fallo que mas caro sale.
        ignore-exceptions:
          - com.ejemplo.microservicio.exception.PeticionRechazadaPorIAException
          # El rechazo del PROPIO bulkhead tampoco es una caida de la
          # dependencia. Es el error mas caro que dejo la prueba de carga,
          # y se descubrio ahi.
          #
          # El bulkhead limita a 10 llamadas simultaneas, y por el orden
          # por defecto de los aspectos de Resilience4j se ejecuta el
          # ULTIMO. Asi que el circuito ve los BulkheadFullException que
          # produce el propio bulkhead y los cuenta como fallos. Medido
          # contra el stack con 20 peticiones simultaneas:
          #
          #   tanda 1: 10 correctas, 11 SERVICIO_SATURADO, 4 CIRCUITO_ABIERTO
          #   tanda 2: 25 CIRCUITO_ABIERTO
          #   y despues, EN SECUCIAL, con Python sano:
          #   CIRCUITO_ABIERTO, CIRCUITO_ABIERTO, CIRCUITO_ABIERTO...
          #
          # Quince peticiones de cargaModerada apagaban la deteccion de
          # fraude de todo el sistema durante los 30 s de
          # wait-duration-in-open-state, sin que hubiera fallado ni una
          # sola llamada a Python. Y lo peor no es que se disparase por un
          # fallo: se dispara con trafico NORMAL, que es justo cuando el
          # detector hace falta.
          #
          # La solucion NO es reordenar los aspectos: bulkheadAspectOrder
          # no es configurable en Resilience4j 2.3.0 (la clase tiene
          # getBulkheadAspectOrder() pero ningun setter, y declararla hace
          # fallar el arranque con "No setter found for property:
          # bulkhead-aspect-order"). Por eso se hace aqui: que el circuito
          # no cuente los rechazos como fallos, que es exactamente lo que
          # significa "saturacion local".
          - io.github.resilience4j.bulkhead.BulkheadFullException

    # EL ORDEN IMPORTA: el circuit breaker debe ejecutarse POR FUERA del
    # retry, para que una peticion del usuario cuente como UN fallo y no
    # como tres (uno por intento). Con el orden invertido, el circuito se
    # abriria tras tres veces menos problemas reales, y el retry no tendria
    # opcion de funcionar.
    circuitBreakerAspectOrder: 1

  retry:
    instances:
      servicioIA:
        max-attempts: 3
        wait-duration: 200ms
        # Con backoff exponencial: el segundo reintento espera mas que
        # el primero. Si Python esta reiniciando, dar margen evita
        # insistir contra algo que todavia no ha despertado.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Solo fallos de laDEPENDENCIA. Un 422 por pais no soportado esta
        # excluido a proposito: reintentado da el mismo 422 y, ademas,
        # alargaria la respuesta honesta de un 400.
        retry-exceptions:
          - com.ejemplo.microservicio.exception.ServicioIANoDisponibleException
    retryAspectOrder: 2

  bulkhead:
    instances:
      servicioIA:
        # SEMAPHORE, no THREADPOOL. El modo THREADPOOL solo funciona con
        # llamadas asincronas (CompletableFuture); sobre una llamada
        # sincrona lanza IllegalStateException en tiempo de ejecucion.
        type: Semaphore
        max-concurrent-calls: 10

