# Configuracion para los tests que levantan el contexto de Spring.
#
# NO hay datasource aqui a proposito. Con Testcontainers, la URL, el
# usuario y la contrasena los inyecta @ServiceConnection desde el
# contenedor real. Fijarlos en un archivo seria ignorarlos.
#
# Lo que si se fija es el COMPORTAMIENTO:
#   - Flyway activado: los tests ejecutan las migraciones de verdad, que
#     es justo lo que H2 no hacia y por lo que una migracion rota pasaba
#     desapercibida.
#   - ddl-auto=validate: Hibernate comprueba que las entidades encajan
#     con el esquema. Si alguien anade una columna al modelo y olvida la
#     migracion, los tests fallan aqui y no en produccion.

spring:
  jpa:
    hibernate:
      # validate, NUNCA create-drop en los tests. Con create-drop se
      # crearian las tablas desde las entidades y las migraciones no se
      # ejecutarian: exactamente el agujero que Testcontainers cierra.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

# Clave fija para los tests: el token se emite con ella y se verifica con
# ella, asi que da igual que sea publica. Fijarla evita el aviso de
# "clave generada al arrancar" en cada ejecucion y hace los tokens
# reproducibles.
jwt:
  secret: clave-de-prueba-para-los-tests-de-integracion

ia:
  base-url: http://localhost:9999
  connect-timeout-seconds: 1
  read-timeout-seconds: 1

resilience4j:
  circuitbreaker:
    instances:
      servicioIA:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 2s
        permitted-number-of-calls-in-half-open-state: 2
        # Se replica de application.yml a proposito. Si el test
        # ComportamientosDeSeguridadTest lee esta lista para comprobar que
        # un 4xx no se reintenta ni cuenta como fallo, tiene que leer la
        # MISMA configuracion que corre en produccion: si aqui faltara,
        # el test comprobaria una configuracion que nadie usa y pasaria
        # aunque la real estuviera mal.
        ignore-exceptions:
          - com.ejemplo.microservicio.exception.PeticionRechazadaPorIAException
    circuitBreakerAspectOrder: 1
  retry:
    instances:
      servicioIA:
        max-attempts: 3
        wait-duration: 20ms
        retry-exceptions:
          - com.ejemplo.microservicio.exception.ServicioIANoDisponibleException
    retryAspectOrder: 2
  bulkhead:
    instances:
      servicioIA:
        type: Semaphore
        max-concurrent-calls: 4

logging:
  level:
    com.ejemplo.microservicio: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
    com.github.dockerjava: WARN
    org.testcontainers: INFO